services:
  db:
    image: postgres:16
    container_name: colabnote_db
    restart: always  # Added: ensures the DB restarts if it crashes
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=colabnote  # Changed to lowercase for sanity
    ports:
      - "5432:5432"
    volumes:
      - pgdata_colabnote:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d colabnote"]
      interval: 10s   # Increased slightly: 5s can be aggressive on slow disks
      timeout: 5s
      retries: 5
    networks:
      - colabnote_net

  mongodb:
    image: mongo:7
    container_name: colabnote_mongodb
    restart: always
    environment:
      - MONGO_INITDB_DATABASE=colabnote
    ports:
      - "27017:27017"
    volumes:
      - mongodata_colabnote:/data/db
    networks:
      - colabnote_net


  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: colabnote_es
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
    volumes:
      - esdata_colabnote:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status.*green\\|yellow'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - colabnote_net

  # Phase 2 — Search and Caching
  redis:
    image: redis:7-alpine
    container_name: colabnote_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata_colabnote:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - colabnote_net

  # Phase 3 — Event Streaming
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: colabnote_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafkadata_colabnote:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - colabnote_net

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: colabnote_consumer
    restart: always
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      MONGO_URL: "mongodb://mongodb:27017"
      MONGO_DB: "colabnote"
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('kafka', 9092)); s.close()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - colabnote_net

  # Phase 5 — Two FastAPI instances behind Nginx (round-robin)
  api1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colabnote_api1
    restart: always
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      INSTANCE_ID: "api1"
      PORT: "8001"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/colabnote"
      MONGO_URL: "mongodb://mongodb:27017"
      MONGO_DB: "colabnote"
      ES_URL: "http://elasticsearch:9200"
      ELASTICSEARCH_INDEX: "notes"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      CACHE_TTL: "3600"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ping', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - colabnote_net

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colabnote_api2
    restart: always
    expose:
      - "8002"
    env_file:
      - .env
    environment:
      INSTANCE_ID: "api2"
      PORT: "8002"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/colabnote"
      MONGO_URL: "mongodb://mongodb:27017"
      MONGO_DB: "colabnote"
      ES_URL: "http://elasticsearch:9200"
      ELASTICSEARCH_INDEX: "notes"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      CACHE_TTL: "3600"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/ping', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - colabnote_net

  nginx:
    image: nginx:1.27-alpine
    container_name: colabnote_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks:
      - colabnote_net


networks:
  colabnote_net:
    driver: bridge

volumes:
  pgdata_colabnote: {}
  mongodata_colabnote: {}
  esdata_colabnote: {}
  redisdata_colabnote: {}
  kafkadata_colabnote: {}

