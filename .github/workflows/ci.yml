name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/colabnote

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install flake8
      - run: |
          flake8 . --count --select=E9,F63,F7,F82 \
            --max-line-length=88 --show-source --statistics \
            --exclude=.venv,venv,frontend,node_modules,__pycache__,.git

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      elasticsearch:
        image: elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms256m -Xmx256m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt pytest-cov
      - run: |
          pytest tests/ --cov=app --cov-report=term-missing \
            --cov-fail-under=50
        env:
          ES_URL: http://localhost:9200
          SKIP_ES_TESTS: "false"

  build-and-push:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Docker tags
        id: tags
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          SHORT_SHA="${GITHUB_SHA::7}"
          BRANCH_TAG="${BRANCH}-${SHORT_SHA}"
          echo "tags=${{ env.DOCKER_IMAGE }}:latest,${{ env.DOCKER_IMAGE }}:${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "consumer_tags=${{ env.DOCKER_IMAGE }}-consumer:latest,${{ env.DOCKER_IMAGE }}-consumer:${BRANCH_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push consumer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: consumer/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.consumer_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
