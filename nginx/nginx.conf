# ---- Upstream pool: two FastAPI instances, round-robin with health-aware failover ----
# `max_fails=3` — mark an instance down after 3 failed health probes
# `fail_timeout=30s` — once marked down, keep it out of the pool for 30s before retrying
# `keepalive 32` — keep 32 idle connections open to each backend (faster than 1-shot)

upstream fastapi_upstream {
    server api1:8001 max_fails=3 fail_timeout=30s;
    server api2:8002 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ---- Server block: listen on host port 80 (mapped from compose) ----
server {
    listen 80;
    server_name _;  # catch-all; put your domain here later

    # Allow GraphQL / multipart uploads up to 10 MB
    client_max_body_size 10m;

    # Generous timeouts so slow Kafka / ES work doesn't get cut off
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Liveness probe for Nginx itself — not proxied, no access log
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Everything else — including /graphql — goes to the upstream pool
    location / {
        proxy_pass http://fastapi_upstream;

        # Pass through real client info so FastAPI logs / CORS work correctly
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep-alive: pass empty Connection so `keepalive 32` above takes effect
        proxy_set_header Connection        "";

        # Required for `keepalive 32` to work — HTTP/1.1, no buffering
        proxy_http_version 1.1;
        proxy_buffering off;
    }
}